// ─── HELPERS ─────────────────────────────────────────────────────────────────
const calcularPuntaje = (respuestas) => {
    const valores = Object.values(respuestas).filter(v => v !== null && v !== undefined);
    if (valores.length === 0) return null;
    const suma = valores.reduce((acc, v) => {
        if (v === 'bien') return acc + 100;
        if (v === 'regular') return acc + 50;
        if (v === 'mal') return acc + 0;
        return acc;
    }, 0);
    return Math.round(suma / valores.length);
};

const etiquetaPuntaje = (p) => {
    if (p === null) return { texto: '—', clase: 'text-gray-400' };
    if (p >= 90) return { texto: `${p} — Excelente`, clase: 'score-excellent' };
    if (p >= 75) return { texto: `${p} — Bueno`, clase: 'score-good' };
    if (p >= 60) return { texto: `${p} — Regular`, clase: 'score-regular' };
    return { texto: `${p} — Deficiente`, clase: 'score-poor' };
};

const formatFecha = (ts) => {
    if (!ts) return '—';
    return new Date(ts).toLocaleString('es-AR', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
    });
};

const badgePuntaje = (p) => {
    if (p === null || p === undefined) return 'bg-gray-100 text-gray-500';
    if (p >= 90) return 'bg-green-100 text-green-800';
    if (p >= 75) return 'bg-blue-100 text-blue-800';
    if (p >= 60) return 'bg-yellow-100 text-yellow-800';
    return 'bg-red-100 text-red-800';
};

function App() {
    const [user, setUser] = useState(null);
    const [vista, setVista] = useState('inicio'); // inicio | checklist | historial | tareas
    const [seccionActiva, setSeccionActiva] = useState(null);
    const [habitacionActiva, setHabitacionActiva] = useState(null);
    const [controles, setControles] = useState([]);
    const [tareas, setTareas] = useState([]);
    const [loginError, setLoginError] = useState('');

    // Cargar datos de Firebase
    useEffect(() => {
        if (!db || !user) return;
        const refControles = db.ref('controles');
        refControles.on('value', snap => {
            const data = snap.val();
            if (data) {
                const arr = Object.entries(data).map(([id, v]) => ({ id, ...v }));
                setControles(arr.sort((a, b) => b.timestamp - a.timestamp));
            } else {
                setControles([]);
            }
        });
        const refTareas = db.ref('tareas');
        refTareas.on('value', snap => {
            const data = snap.val();
            if (data) {
                const arr = Object.entries(data).map(([id, v]) => ({ id, ...v }));
                setTareas(arr.sort((a, b) => b.timestamp - a.timestamp));
            } else {
                setTareas([]);
            }
        });
        return () => { refControles.off(); refTareas.off(); };
    }, [user]);

    const handleLogin = (username, password) => {
        const found = USERS.find(u => u.username === username && u.password === password);
        if (found) {
            setUser(found);
            setLoginError('');
        } else {
            setLoginError('Usuario o contraseña incorrectos');
        }
    };

    if (!user) return React.createElement(LoginScreen, { onLogin: handleLogin, error: loginError });

    return React.createElement('div', { className: 'min-h-screen bg-gray-50' },
        // Header
        React.createElement('header', { className: 'azur-blue text-white px-4 py-3 flex items-center justify-between shadow-lg' },
            React.createElement('div', null,
                React.createElement('h1', { className: 'text-lg font-bold' }, 'Azur — Control de Calidad'),
                React.createElement('p', { className: 'text-xs opacity-75' }, user.name)
            ),
            React.createElement('div', { className: 'flex gap-2' },
                React.createElement('button', {
                    onClick: () => setVista('inicio'),
                    className: `px-3 py-1.5 rounded text-sm font-medium ${vista === 'inicio' ? 'bg-white text-blue-900' : 'bg-white/20 hover:bg-white/30'}`
                }, '🏠 Inicio'),
                React.createElement('button', {

                }, '📋 Historial'),

                },

                        className: 'absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center'
                    }, tareas.filter(t => !t.resuelta).length) : null
                ),
                React.createElement('button', {
                    onClick: () => { setUser(null); setVista('inicio'); },
                    className: 'px-3 py-1.5 rounded text-sm bg-white/20 hover:bg-white/30'
                }, 'Salir')
            )
        ),

        // Contenido
        vista === 'inicio' ? React.createElement(Inicio, {

            onIniciarControl: (seccion, hab) => {
                setSeccionActiva(seccion);
                setHabitacionActiva(hab || null);
                setVista('checklist');
            }
        }) : null,

// ─── CHECKLIST VIEW ──────────────────────────────────────────────────────────
function ChecklistView({ user, seccion: seccionKey, habitacion, onFinalizar }) {
    const config = CHECKLISTS[seccionKey];
    const totalItems = config.secciones.reduce((acc, s) => acc + s.items.length, 0);

    const [respuestas, setRespuestas] = useState({});
    const [observaciones, setObservaciones] = useState({});
    const [guardando, setGuardando] = useState(false);
    const [confirmando, setConfirmando] = useState(false);

    const respondidos = Object.values(respuestas).filter(v => v !== null).length;
    const puntaje = calcularPuntaje(respuestas);
    const { texto: textoP, clase: claseP } = etiquetaPuntaje(puntaje);

    const setRespuesta = (key, valor) => {
        setRespuestas(prev => ({ ...prev, [key]: valor }));
    };

    const setObs = (key, valor) => {
        setObservaciones(prev => ({ ...prev, [key]: valor }));
    };

    const handleFinalizar = async () => {
        if (!confirmando) { setConfirmando(true); return; }
        setGuardando(true);

        const control = {
            seccion: seccionKey,
            seccionNombre: config.nombre,
            habitacion: habitacion || null,
            userId: user.id,
            userName: user.name,
            timestamp: Date.now(),
            puntaje,
            respuestas,
            observaciones,
        };

        if (db) {
            const ref = await db.ref('controles').push(control);
            const controlId = ref.key;

            // Generar tareas para ítems con mal o regular
            const tareasNuevas = [];
            config.secciones.forEach(sec => {
                sec.items.forEach((item, idx) => {
                    const key = `${sec.nombre}__${idx}`;
                    const resp = respuestas[key];
                    if (resp === 'mal' || resp === 'regular') {
                        tareasNuevas.push({
                            controlId,
                            seccion: seccionKey,
                            seccionNombre: config.nombre,
                            habitacion: habitacion || null,
                            seccionItem: sec.nombre,
                            item,
                            estado: resp,
                            observacion: observaciones[key] || '',
                            timestamp: Date.now(),
                            resuelta: false,
                            area: null,
                        });
                    }
                });
            });

            for (const tarea of tareasNuevas) {
                await db.ref('tareas').push(tarea);
            }
        }

        setGuardando(false);
        onFinalizar();
    };

    return React.createElement('div', { className: 'max-w-2xl mx-auto p-4' },
        // Header del checklist
        React.createElement('div', { className: 'bg-white rounded-xl shadow p-4 mb-4 flex items-center justify-between' },
            React.createElement('div', null,
                React.createElement('div', { className: 'flex items-center gap-2' },
                    React.createElement('span', { className: 'text-2xl' }, config.icono),
                    React.createElement('h2', { className: 'font-bold text-gray-800 text-lg' }, config.nombre),
                    habitacion ? React.createElement('span', { className: 'bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded-full font-medium' },
                        `Hab. #${habitacion.numero} — ${habitacion.categoria}`
                    ) : null
                ),
                React.createElement('p', { className: 'text-sm text-gray-500 mt-1' },
                    `${respondidos}/${totalItems} ítems completados`
                )
            ),
            puntaje !== null ? React.createElement('div', { className: 'text-right' },
                React.createElement('div', { className: `text-xl font-bold ${claseP}` }, textoP)
            ) : null
        ),

        // Secciones
        config.secciones.map(sec => React.createElement('div', { key: sec.nombre, className: 'mb-4' },
            React.createElement('h3', { className: 'font-semibold text-gray-700 mb-2 px-1' }, sec.nombre),
            React.createElement('div', { className: 'space-y-2' },
                sec.items.map((item, idx) => {
                    const key = `${sec.nombre}__${idx}`;
                    const resp = respuestas[key];
                    let claseItem = 'item-pending';
                    if (resp === 'bien') claseItem = 'item-bien';
                    if (resp === 'regular') claseItem = 'item-regular';
                    if (resp === 'mal') claseItem = 'item-mal';

                    return React.createElement('div', { key: key, className: `bg-white rounded-xl p-3 shadow-sm ${claseItem}` },
                        React.createElement('p', { className: 'text-sm text-gray-800 mb-2' }, item),
                        React.createElement('div', { className: 'flex gap-2 flex-wrap' },
                            React.createElement('button', {
                                onClick: () => setRespuesta(key, 'bien'),
                                className: `px-3 py-1.5 rounded-lg text-xs font-semibold transition ${resp === 'bien' ? 'bg-green-500 text-white' : 'bg-green-100 text-green-700 hover:bg-green-200'}`
                            }, '✅ Bien'),
                            React.createElement('button', {
                                onClick: () => setRespuesta(key, 'regular'),
                                className: `px-3 py-1.5 rounded-lg text-xs font-semibold transition ${resp === 'regular' ? 'bg-yellow-500 text-white' : 'bg-yellow-100 text-yellow-700 hover:bg-yellow-200'}`
                            }, '⚠️ Regular'),
                            React.createElement('button', {
                                onClick: () => setRespuesta(key, 'mal'),
                                className: `px-3 py-1.5 rounded-lg text-xs font-semibold transition ${resp === 'mal' ? 'bg-red-500 text-white' : 'bg-red-100 text-red-700 hover:bg-red-200'}`
                            }, '❌ Mal'),
                            (resp === 'regular' || resp === 'mal') ? React.createElement('input', {
                                type: 'text',
                                placeholder: 'Observación...',
                                value: observaciones[key] || '',
                                onChange: e => setObs(key, e.target.value),
                                className: 'flex-1 min-w-32 px-2 py-1 text-xs border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-400'
                            }) : null
                        )
                    );
                })
            )
        )),

        // Botones finales
        React.createElement('div', { className: 'flex gap-3 mt-6 mb-8' },
            React.createElement('button', {
                onClick: onFinalizar,
                className: 'flex-1 bg-gray-200 text-gray-700 py-3 rounded-xl font-semibold hover:bg-gray-300'
            }, 'Cancelar'),
            React.createElement('button', {
                onClick: handleFinalizar,
                disabled: guardando || respondidos === 0,
                className: `flex-1 azur-blue text-white py-3 rounded-xl font-semibold hover:opacity-90 disabled:opacity-50 ${confirmando ? 'ring-2 ring-offset-2 ring-blue-400' : ''}`
            }, guardando ? 'Guardando...' : confirmando ? `Confirmar — ${textoP}` : `Finalizar control`)
        )
    );
}

                key: f,
                onClick: () => setFiltro(f),
                className: `px-4 py-2 rounded-lg text-sm font-medium transition ${filtro === f ? 'azur-blue text-white' : 'bg-white text-gray-600 hover:bg-gray-100 shadow-sm'}`
            }, f === 'pendientes' ? `⚠️ Pendientes (${tareas.filter(t => !t.resuelta).length})` : f === 'resueltas' ? '✅ Resueltas' : '📋 Todas'))
        ),

        filtradas.length === 0 ? React.createElement('div', { className: 'bg-white rounded-xl shadow p-8 text-center text-gray-400' },
            React.createElement('div', { className: 'text-4xl mb-2' }, filtro === 'pendientes' ? '🎉' : '📋'),
            React.createElement('p', null, filtro === 'pendientes' ? '¡Sin tareas pendientes!' : 'No hay tareas en esta categoría')
        ) : React.createElement('div', { className: 'space-y-3' },
            filtradas.map(t => React.createElement('div', {
                key: t.id,
                className: `bg-white rounded-xl shadow p-4 border-l-4 ${t.estado === 'mal' ? 'border-red-500' : 'border-yellow-500'}`
            },
                React.createElement('div', { className: 'flex items-start justify-between mb-2' },
                    React.createElement('div', null,
                        React.createElement('div', { className: 'font-semibold text-gray-800 text-sm' }, t.item),
                        React.createElement('div', { className: 'text-xs text-gray-500 mt-0.5' },
                            `${t.seccionNombre}${t.habitacion ? ` — Hab. #${t.habitacion.numero}` : ''} · ${t.seccionItem}`
                        ),
                        React.createElement('div', { className: 'text-xs text-gray-400 mt-0.5' }, formatFecha(t.timestamp))
                    ),
                    React.createElement('span', { className: `text-xs font-bold px-2 py-0.5 rounded-full ${t.estado === 'mal' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}` },
                        t.estado === 'mal' ? '❌ Mal' : '⚠️ Regular'
                    )
                ),

                t.observacion ? React.createElement('div', { className: 'text-sm text-gray-600 italic mb-2 bg-gray-50 rounded p-2' },
                    `"${t.observacion}"`
                ) : null,

                // Área asignada
                !t.resuelta ? React.createElement('div', { className: 'flex items-center gap-2 mb-2' },
                    React.createElement('span', { className: 'text-xs text-gray-500' }, 'Área:'),
                    ['HSK', 'Mantenimiento'].map(area => React.createElement('button', {
                        key: area,
                        onClick: () => handleAsignarArea(t, area),
                        className: `px-2 py-1 text-xs rounded-full transition ${t.area === area ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`
                    }, area))
                ) : null,

                // Resolución
                t.resuelta ? React.createElement('div', { className: 'bg-green-50 rounded-lg p-2 text-xs text-green-700 mt-2' },
                    React.createElement('div', { className: 'font-semibold' }, `✅ Resuelto por ${t.resueltaPor}`),
                    React.createElement('div', { className: 'text-green-600' }, formatFecha(t.resueltaTimestamp)),
                    t.notaResolucion ? React.createElement('div', { className: 'mt-1 italic' }, `"${t.notaResolucion}"`) : null
                ) : resolviendo === t.id ? React.createElement('div', { className: 'mt-2 space-y-2' },
                    React.createElement('textarea', {
                        placeholder: '¿Qué se hizo para resolverlo? (opcional)',
                        value: notaResolucion,
                        onChange: e => setNotaResolucion(e.target.value),
                        rows: 2,
                        className: 'w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-400 resize-none'
                    }),
                    React.createElement('div', { className: 'flex gap-2' },
                        React.createElement('button', {
                            onClick: () => handleResolver(t),
                            className: 'flex-1 bg-green-500 text-white py-2 rounded-lg text-sm font-semibold hover:bg-green-600'
                        }, '✅ Confirmar resolución'),
                        React.createElement('button', {
                            onClick: () => { setResolviendo(null); setNotaResolucion(''); },
                            className: 'px-4 py-2 bg-gray-200 text-gray-600 rounded-lg text-sm hover:bg-gray-300'
                        }, 'Cancelar')
                    )
                ) : React.createElement('button', {
                    onClick: () => setResolviendo(t.id),
                    className: 'mt-2 w-full bg-green-50 text-green-700 border border-green-200 py-2 rounded-lg text-sm font-semibold hover:bg-green-100 transition'
                }, 'Marcar como resuelto')
            ))
        )
    );
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
